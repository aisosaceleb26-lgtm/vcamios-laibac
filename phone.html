<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Phone: Send Gallery to Desktop</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>body{font-family:system-ui,Arial;margin:16px}img{max-width:100%;height:auto;border:1px solid #ccc;margin-top:8px}</style>
</head>
<body>
  <h2>Phone: Pick image/video to send</h2>
  <input id="file" type="file" accept="image/*,video/*" />
  <div>
    <button id="send" disabled>Send to desktop</button>
  </div>
  <div id="preview"></div>
  <script>
    const ws = new WebSocket(`ws://${location.host}`);
    const fileInput = document.getElementById('file');
    const sendBtn = document.getElementById('send');
    const preview = document.getElementById('preview');

    let currentDataUrl = null;

    fileInput.addEventListener('change', async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        currentDataUrl = reader.result;
        preview.innerHTML = '';
        if (f.type.startsWith('image/')) {
          const img = document.createElement('img'); img.src = currentDataUrl; preview.appendChild(img);
        } else {
          const v = document.createElement('video'); v.src = currentDataUrl; v.controls = true; v.autoplay = false; v.style.maxWidth = '100%'; preview.appendChild(v);
        }
        sendBtn.disabled = false;
      };
      reader.readAsDataURL(f);
    });

    sendBtn.addEventListener('click', () => {
      if (!currentDataUrl || ws.readyState !== WebSocket.OPEN) return alert('Not connected');
      // Send as JSON message with type and data
      const payload = JSON.stringify({ type: 'frame', data: currentDataUrl });
      ws.send(payload);
    });

    ws.addEventListener('open', () => console.log('WS open'));
    ws.addEventListener('close', () => console.log('WS closed'));
  </script>
</body>
</html>
